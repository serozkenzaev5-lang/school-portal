<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал</title>
    <!-- Заглушка для отмены ошибки 404 favicon.ico -->
    <link rel="shortcut icon" href="data:image/x-icon;," type="image/x-icon">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">

    <div class="auth-card">
        <div class="auth-header">
            <div class="school-logo">🎓</div>
            <h2>Школьный Портал</h2>
            <p id="authSubtitle">Вход в личный кабинет</p>
        </div>

        <!-- Форма входа -->
        <form id="loginForm" class="auth-form">
            <div class="input-group">
                <input type="email" id="loginEmail" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" placeholder="Пароль" required>
            </div>
            <button type="submit" class="btn-primary" id="loginBtn">Войти</button>
            
            <p class="auth-toggle">
                Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a>
            </p>
        </form>

        <!-- Форма регистрации -->
        <form id="registerForm" class="auth-form hidden">
            <div class="input-group">
                <input type="text" id="regName" placeholder="Имя и Фамилия" required>
            </div>
            <div class="input-group">
                <input type="email" id="regEmail" placeholder="Email" required>
            </div>
            <div class="input-group">
                <input type="password" id="regPassword" placeholder="Пароль" required>
            </div>
            <div class="input-group">
                <select id="regRole" required>
                    <option value="" disabled selected>Выберите вашу роль</option>
                    <option value="student">Ученик</option>
                    <option value="teacher">Учитель</option>
                    <option value="parent">Родитель</option>
                </select>
            </div>
            <button type="submit" class="btn-primary" id="regBtn">Зарегистрироваться</button>
            
            <p class="auth-toggle">
                Уже есть аккаунт? <a href="#" id="showLogin">Войти</a>
            </p>
        </form>
    </div>

    <script type="module" src="js/auth.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');
        const subtitle = document.getElementById('authSubtitle');

        document.getElementById('showRegister').addEventListener('click', (e) => {
            e.preventDefault();
            loginForm.classList.add('hidden');
            registerForm.classList.remove('hidden');
            subtitle.textContent = 'Создайте новый аккаунт';
        });

        document.getElementById('showLogin').addEventListener('click', (e) => {
            e.preventDefault();
            registerForm.classList.add('hidden');
            loginForm.classList.remove('hidden');
            subtitle.textContent = 'Вход в личный кабинет';
        });
    </script>
</body>
</html>
