<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал - Авторизация</title>
    <!-- Подключаем CSS файл -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">

    <div class="auth-container">
        <div class="auth-card">
            
            <!-- Верхняя панель (Переключение языка и темы) -->
            <div class="auth-top-bar">
                <select class="lang-select" id="langSelect">
                    <option value="ru">RU</option>
                    <option value="uz">UZ</option>
                </select>
                <button class="theme-toggle-btn" id="themeToggleBtn" type="button">☀️</button>
            </div>

            <!-- БЛОК ВХОДА -->
            <div id="loginBlock">
                <div class="auth-header">
                    <div class="academic-cap">🎓</div>
                    <h1>Школьный Портал</h1>
                    <p class="subtitle">Вход в личный кабинет</p>
                </div>

                <form class="auth-form" id="loginForm">
                    <div class="form-group">
                        <label for="loginEmail">Email</label>
                        <input type="email" id="loginEmail" class="input-text" placeholder="name@school.ru" required>
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="loginPassword">Пароль</label>
                            <a href="#" class="forgot-link">Забыли пароль?</a>
                        </div>
                        <input type="password" id="loginPassword" class="input-text" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn-submit">Войти</button>
                </form>

                <div class="auth-footer">
                    <span>Нет аккаунта?</span>
                    <a href="#" class="link-primary" id="showRegisterBtn">Зарегистрироваться</a>
                </div>
            </div>

            <!-- БЛОК РЕГИСТРАЦИИ (скрыт по умолчанию) -->
            <div id="registerBlock" class="hidden">
                <div class="auth-header">
                    <div class="academic-cap">🎓</div>
                    <h1>Школьный Портал</h1>
                    <p class="subtitle">Создайте новый аккаунт</p>
                </div>

                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label for="regName">Имя и Фамилия</label>
                        <input type="text" id="regName" class="input-text" placeholder="Иван Иванов" required>
                    </div>

                    <div class="form-group">
                        <label for="regEmail">Email</label>
                        <input type="email" id="regEmail" class="input-text" placeholder="name@school.ru" required>
                    </div>

                    <div class="form-group">
                        <label for="regPassword">Пароль</label>
                        <input type="password" id="regPassword" class="input-text" placeholder="••••••••" required>
                    </div>

                    <div class="form-group">
                        <label for="regRole">Ваша роль</label>
                        <select id="regRole" class="input-select select-role" required>
                            <option value="" disabled selected>Выберите вашу роль</option>
                            <option value="student">Ученик</option>
                            <option value="teacher">Учитель</option>
                        </select>
                    </div>

                    <button type="submit" class="btn-submit">Зарегистрироваться</button>
                </form>

                <div class="auth-footer">
                    <span>Уже есть аккаунт?</span>
                    <a href="#" class="link-primary" id="showLoginBtn">Войти</a>
                </div>
            </div>

        </div>
    </div>

    <!-- Подключение скрипта логики -->
    <script src="script.js"></script>
</body>
</html>
