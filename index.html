<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал — Авторизация</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme">

    <div class="auth-container">
        <div class="auth-card">
            <!-- Шапка карточки: Языки и Тема -->
            <div class="auth-card-header">
                <select id="langSelect" class="lang-dropdown">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="uz">UZ</option>
                </select>
                <button id="themeToggle" class="icon-btn" title="Переключить тему">☀️</button>
            </div>

            <!-- Иконка и Заголовки -->
            <div class="auth-card-body">
                <div class="auth-icon">🎓</div>
                <h2 id="portalTitle">Школьный Портал</h2>
                <p id="authSubtitle" class="subtitle">Вход в личный кабинет</p>

                <!-- 1. ФОРМА ВХОДА -->
                <form id="loginForm" class="auth-form active">
                    <div class="form-group">
                        <label for="loginEmail" id="lblLoginEmail">Email</label>
                        <input type="email" id="loginEmail" placeholder="name@school.com" required class="input-text">
                    </div>

                    <div class="form-group">
                        <div class="label-row">
                            <label for="loginPassword" id="lblLoginPassword">Пароль</label>
                            <a href="#" id="forgotPasswordBtn" class="link-small">Забыли пароль?</a>
                        </div>
                        <input type="password" id="loginPassword" placeholder="••••••••••••" required class="input-text">
                    </div>

                    <button type="submit" id="btnLogin" class="btn-primary full-width">Войти</button>

                    <div class="auth-footer">
                        <span id="noAccountText">Нет аккаунта?</span>
                        <a href="#" id="toRegisterLink" class="link-bold">Зарегистрироваться</a>
                    </div>
                </form>

                <!-- 2. ФОРМА РЕГИСТРАЦИИ -->
                <form id="registerForm" class="auth-form hidden">
                    <div class="form-group">
                        <label for="regName" id="lblRegName">Имя и Фамилия</label>
                        <input type="text" id="regName" placeholder="Иван Иванов" required class="input-text">
                    </div>

                    <div class="form-group">
                        <label for="regEmail" id="lblRegEmail">Email</label>
                        <input type="email" id="regEmail" placeholder="name@school.com" required class="input-text">
                    </div>

                    <div class="form-group">
                        <label for="regPassword" id="lblRegPassword">Пароль</label>
                        <input type="password" id="regPassword" placeholder="••••••••••••" required class="input-text">
                    </div>

                    <div class="form-group">
                        <label for="regRole" id="lblRegRole">Ваша роль</label>
                        <select id="regRole" required class="input-select">
                            <option value="" disabled selected>Выберите вашу роль</option>
                            <option value="student">Ученик</option>
                            <option value="teacher">Учитель</option>
                            <option value="parent">Родитель</option>
                        </select>
                    </div>

                    <button type="submit" id="btnRegister" class="btn-primary full-width">Зарегистрироваться</button>

                    <div class="auth-footer">
                        <span id="hasAccountText">Уже есть аккаунт?</span>
                        <a href="#" id="toLoginLink" class="link-bold">Войти</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Подключаем логику как модуль -->
    <script type="module" src="js/auth.js"></script>
</body>
</html>
