<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">

    <div class="auth-container">
        <div class="auth-card">
            
            <!-- Шапка с кнопками переключения языка и темы -->
            <div class="auth-top-bar">
                <select id="langSelect" class="lang-select">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="uz">UZ</option>
                </select>
                <button id="themeToggle" class="theme-btn">☀️</button>
            </div>

            <!-- Иконка шапочки -->
            <div class="auth-header">
                <div class="academic-cap">🎓</div>
                <h1 id="portalTitle">Школьный Портал</h1>
                <p id="authSubtitle" class="subtitle">Вход в личный кабинет</p>
            </div>

            <!-- ФОРМА ВХОДА -->
            <form id="loginForm" class="auth-form">
                <div class="form-group">
                    <label id="lblLoginEmail">Email</label>
                    <input type="email" id="loginEmail" value="serozkenzaev5@gmail.com" required>
                </div>

                <div class="form-group">
                    <div class="label-with-link">
                        <label id="lblLoginPassword">Пароль</label>
                        <a href="#" id="forgotPasswordBtn" class="forgot-link">Забыли пароль?</a>
                    </div>
                    <input type="password" id="loginPassword" value="••••••••••••" required>
                </div>

                <button type="submit" id="btnLogin" class="btn-submit">Войти</button>

                <div class="auth-footer">
                    <span id="noAccountText">Нет аккаунта?</span>
                    <a href="#" id="toRegisterLink">Зарегистрироваться</a>
                </div>
            </form>

            <!-- ФОРМА РЕГИСТРАЦИИ -->
            <form id="registerForm" class="auth-form" style="display: none;">
                <div class="form-group">
                    <label id="lblRegName">Имя и Фамилия</label>
                    <input type="text" id="regName" placeholder="Иван Иванов" required>
                </div>

                <div class="form-group">
                    <label id="lblRegEmail">Email</label>
                    <input type="email" id="regEmail" placeholder="name@school.ru" required>
                </div>

                <div class="form-group">
                    <label id="lblRegPassword">Пароль</label>
                    <input type="password" id="regPassword" placeholder="••••••••••••" required>
                </div>

                <div class="form-group">
                    <label id="lblRegRole">Ваша роль</label>
                    <select id="regRole" required class="select-role">
                        <option value="" disabled selected>Выберите вашу роль</option>
                        <option value="student">Ученик</option>
                        <option value="teacher">Учитель</option>
                        <option value="parent">Родитель</option>
                    </select>
                </div>

                <button type="submit" id="btnRegister" class="btn-submit">Зарегистрироваться</button>

                <div class="auth-footer">
                    <span id="hasAccountText">Уже есть аккаунт?</span>
                    <a href="#" id="toLoginLink">Войти</a>
                </div>
            </form>

        </div>
    </div>

    <script type="module" src="js/auth.js"></script>
</body>
</html>
