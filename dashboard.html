<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал — Личный кабинет</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme">

    <div class="app-layout">
        <!-- Шапка -->
        <header class="app-header">
            <div class="user-profile">
                <div class="avatar" id="userAvatar">ШК</div>
                <div class="user-details">
                    <h2 id="userName">Загрузка...</h2>
                    <span class="role-badge" id="userRole">Ученик</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="logoutBtn" class="icon-btn" title="Выйти">🚪</button>
            </div>
        </header>

        <!-- Календарь -->
        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prevWeekBtn" class="nav-arrow-btn">‹</button>
                <h3 id="currentMonthYear">Август 2026</h3>
                <button id="nextWeekBtn" class="nav-arrow-btn">›</button>
            </div>
            
            <div class="calendar-days" id="calendarDays"></div>

            <div class="calendar-controls">
                <button class="cal-pill active" id="btnToday">Сегодня</button>
                <button class="cal-pill icon-only" id="themeToggle">☀️</button>
            </div>
        </section>

        <!-- Контент -->
        <main class="app-content">
            <!-- Вкладка: Расписание -->
            <div id="tab-schedule" class="tab-page">
                <h3 id="selectedDateTitle" style="margin-bottom: 16px;">Расписание</h3>
                <div id="scheduleList" class="card-list"></div>
            </div>

            <!-- Вкладка: Оценки -->
            <div id="tab-grades" class="tab-page hidden">
                <h3 style="margin-bottom: 16px;">Успеваемость и отметки</h3>
                
                <!-- Панель учителя: Форма выставления оценки -->
                <div id="teacherGradePanel" class="card hidden" style="margin-bottom: 20px;">
                    <h4>Выставить оценку / отметку</h4>
                    <form id="addGradeForm" style="display:flex; flex-direction:column; gap:12px; margin-top:12px;">
                        <select id="gradeStudentSelect" required class="input-select">
                            <option value="" disabled selected>Выберите ученика</option>
                        </select>
                        <select id="gradeSubjectSelect" required class="input-select">
                            <option value="Математика">Математика</option>
                            <option value="Русский язык">Русский язык</option>
                            <option value="Английский язык">Английский язык</option>
                            <option value="Физика">Физика</option>
                            <option value="Python">Python</option>
                        </select>
                        <select id="gradeValueSelect" required class="input-select">
                            <option value="5">5 (Отлично)</option>
                            <option value="4">4 (Хорошо)</option>
                            <option value="3">3 (Удовлетворительно)</option>
                            <option value="2">2 (Неудовлетворительно)</option>
                            <option value="Б">Б (Болеет)</option>
                            <option value="П">П (Прогулял)</option>
                        </select>
                        <input type="text" id="gradeReasonInput" placeholder="Причина (например: Самостоятельная работа)" class="input-text" required>
                        <button type="submit" class="btn-primary">Сохранить отметку</button>
                    </form>
                </div>

                <div id="gradesList" class="card-list"></div>
            </div>

            <!-- Вкладка: Задания -->
            <div id="tab-tasks" class="tab-page hidden">
                <h3 style="margin-bottom: 16px;">Домашние задания</h3>

                <!-- Панель учителя: Публикация ДЗ -->
                <div id="teacherTaskPanel" class="card hidden" style="margin-bottom: 20px;">
                    <h4>Добавить домашнее задание</h4>
                    <form id="addTaskForm" style="display:flex; flex-direction:column; gap:12px; margin-top:12px;">
                        <select id="taskSubjectSelect" required class="input-select">
                            <option value="Математика">Математика</option>
                            <option value="Русский язык">Русский язык</option>
                            <option value="Английский язык">Английский язык</option>
                            <option value="Физика">Физика</option>
                            <option value="Python">Python</option>
                        </select>
                        <input type="date" id="taskDueDate" required class="input-text">
                        <textarea id="taskDescInput" placeholder="Описание задания..." class="input-text" rows="3" required></textarea>
                        <button type="submit" class="btn-primary">Опубликовать ДЗ</button>
                    </form>
                </div>

                <div id="tasksList" class="card-list"></div>
            </div>
        </main>

        <!-- Навигация -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="schedule">
                <span>📅</span>
                <small>Расписание</small>
            </button>
            <button class="nav-item" data-tab="grades">
                <span>⭐</span>
                <small>Оценки</small>
            </button>
            <button class="nav-item" data-tab="tasks">
                <span>✔</span>
                <small>Задания</small>
            </button>
        </nav>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
