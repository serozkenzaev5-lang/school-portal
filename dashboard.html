<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал — Личный кабинет</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="light-theme">

    <div class="app-layout">
        <header class="app-header">
            <div class="user-profile">
                <div class="avatar" id="userAvatar">ШК</div>
                <div class="user-details">
                    <h2 id="userName">Шероз Кенжаев</h2>
                    <span class="role-badge" id="userRole">Ученик</span>
                </div>
            </div>
            <div class="header-actions">
                <button id="logoutBtn" class="icon-btn" title="Выйти">🚪</button>
            </div>
        </header>

        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prevWeekBtn" class="nav-arrow-btn" aria-label="Предыдущая неделя">‹</button>
                <h3 id="currentMonthYear">Август 2026</h3>
                <button id="nextWeekBtn" class="nav-arrow-btn" aria-label="Следующая неделя">›</button>
            </div>
            
            <div class="calendar-days" id="calendarDays"></div>

            <div class="calendar-controls">
                <button class="cal-pill active" id="btnToday">Сегодня</button>
                <button class="cal-pill icon-only" id="themeToggle">☀️</button>
            </div>
        </section>

        <main class="app-content">
            <div id="tab-schedule" class="tab-page">
                <h3 id="selectedDateTitle" style="margin-bottom: 16px;">Расписание</h3>
                <div id="scheduleList" class="card-list"></div>
            </div>

            <div id="tab-grades" class="tab-page hidden">
                <h3 style="margin-bottom: 16px;">Оценки</h3>
                <div class="card"><p>Раздел оценок пуст.</p></div>
            </div>

            <div id="tab-tasks" class="tab-page hidden">
                <h3 style="margin-bottom: 16px;">Задания</h3>
                <div class="card"><p>Заданий нет.</p></div>
            </div>
        </main>

        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="schedule">
                <span>📅</span>
                <small>Расписание</small>
            </button>
            <button class="nav-item" data-tab="grades">
                <span>⭐</span>
                <small>Оценки</small>
            </button>
            <button class="nav-item" data-tab="tasks">
                <span>✔</span>
                <small>Задания</small>
            </button>
        </nav>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
