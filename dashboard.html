<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал — Личный кабинет</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="dark-theme">

    <div class="app-layout">
        <!-- Шапка сайта -->
        <header class="app-header">
            <div class="user-profile">
                <div class="avatar" id="userAvatar">У</div>
                <div class="user-details">
                    <h2 id="userName">Загрузка...</h2>
                    <span class="role-badge" id="userRole">Ученик</span>
                </div>
            </div>
            <div class="header-actions">
                <select id="langSelect" class="lang-dropdown">
                    <option value="ru">RU</option>
                    <option value="en">EN</option>
                    <option value="uz">UZ</option>
                </select>
                <button id="logoutBtn" class="icon-btn" title="Выйти">🚪</button>
            </div>
        </header>

        <!-- Интерактивный Календарь -->
        <section class="calendar-section">
            <div class="calendar-header">
                <button id="prevWeek" class="icon-btn">‹</button>
                <h3 id="currentMonthYear">Сентябрь 2026</h3>
                <button id="nextWeek" class="icon-btn">›</button>
            </div>
            
            <div class="calendar-days" id="calendarDays"></div>

            <div class="calendar-controls">
                <button class="cal-pill active" id="btnToday">Сегодня</button>
                <button class="cal-pill icon-only" id="themeToggle">☀️</button>
            </div>
        </section>

        <!-- Основной контент -->
        <main class="app-content">
            <div id="tab-schedule" class="tab-page">
                <h3 id="selectedDateTitle" style="margin-bottom: 16px;">Расписание</h3>
                <div id="scheduleList" class="card-list"></div>
            </div>

            <div id="tab-grades" class="tab-page hidden">
                <h3 style="margin-bottom: 16px;">Дневник успеваемости</h3>
                <div id="gradesList" class="card-list"></div>
            </div>

            <div id="tab-tasks" class="tab-page hidden">
                <h3 style="margin-bottom: 16px;">Домашние задания</h3>
                <div class="card">
                    <p>Заданий пока нет.</p>
                </div>
            </div>
        </main>

        <!-- Нижнее меню навигации -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="schedule">
                <span>📅</span>
                <small>Расписание</small>
            </button>
            <button class="nav-item" data-tab="grades">
                <span>📊</span>
                <small>Оценки</small>
            </button>
            <button class="nav-item" data-tab="tasks">
                <span>📝</span>
                <small>Задания</small>
            </button>
        </nav>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
