<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьный Портал</title>
    <link rel="shortcut icon" href="#">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Шапка с профилем -->
        <header class="app-header">
            <div class="user-profile">
                <div class="avatar" id="userAvatar">УК</div>
                <div class="user-details">
                    <h2 id="userName">Загрузка...</h2>
                    <span id="userRole" class="role-badge">Ученик</span>
                </div>
            </div>
            <button id="logoutBtn" class="icon-btn" title="Выйти">🚪</button>
        </header>

        <!-- Календарная плашка -->
        <div class="calendar-bar">
            <div class="calendar-days">
                <div class="day-item"><span>Пн</span><strong>3</strong></div>
                <div class="day-item"><span>Вт</span><strong>4</strong></div>
                <div class="day-item active"><span>Ср</span><strong>5</strong></div>
                <div class="day-item"><span>Чт</span><strong>6</strong></div>
                <div class="day-item"><span>Пт</span><strong>7</strong></div>
                <div class="day-item weekend"><span>Сб</span><strong>8</strong></div>
                <div class="day-item weekend"><span>Вс</span><strong>9</strong></div>
            </div>
        </div>

        <!-- Контент вкладок -->
        <main class="app-content">
            <section id="tab-schedule" class="tab-page active">
                <div class="card-list">
                    <div class="card lesson-card">
                        <span class="lesson-num">1</span>
                        <div class="lesson-info">
                            <h4>Математика</h4>
                            <p>Кабинет 302 • 08:30 - 09:15</p>
                        </div>
                    </div>
                    <div class="card lesson-card">
                        <span class="lesson-num">2</span>
                        <div class="lesson-info">
                            <h4>Русский язык</h4>
                            <p>Кабинет 210 • 09:25 - 10:10</p>
                        </div>
                    </div>
                    <div class="card lesson-card">
                        <span class="lesson-num">3</span>
                        <div class="lesson-info">
                            <h4>Физика</h4>
                            <p>Кабинет 105 • 10:30 - 11:15</p>
                        </div>
                    </div>
                </div>
            </section>

            <section id="tab-grades" class="tab-page hidden">
                <h3>Дневник успеваемости</h3>
                <div id="gradesList" class="card-list">Загрузка...</div>
            </section>

            <section id="tab-homework" class="tab-page hidden">
                <h3>Домашние задания</h3>
                <div class="card-list">
                    <div class="card"><strong>Математика:</strong> №124, №125</div>
                    <div class="card"><strong>Физика:</strong> Параграф 12, выучить формулы</div>
                </div>
            </section>
        </main>

        <!-- Нижнее адаптивное меню (Bottom Navigation) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="schedule">
                <span class="nav-icon">📅</span>
                <span class="nav-label">Расписание</span>
            </button>
            <button class="nav-item" data-tab="grades">
                <span class="nav-icon">⭐</span>
                <span class="nav-label">Оценки</span>
            </button>
            <button class="nav-item" data-tab="homework">
                <span class="nav-icon">📝</span>
                <span class="nav-label">Задания</span>
            </button>
        </nav>
    </div>

    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
